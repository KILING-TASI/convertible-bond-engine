name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[evidence]"
      - run: python -m unittest discover -s tests -v
      - run: cb-engine examples/demo.json --out local-data/result.json
      - run: cb-engine examples/portfolio.json --mode portfolio --out local-data/portfolio.json
      - run: cb-engine examples/portfolio.json --mode screen --max-price 110 --exclude-call-risk --out local-data/screen.json
      - run: cb-engine examples/market-demo.json --format html --out local-data/card.html
      - run: cb-engine examples/market-demo.json --terms examples/terms-113042.json --format html --out local-data/evidence-card.html
      - run: python -m cbengine.rules examples/rule-context-demo.json --out local-data/rules.json
      - run: cb-engine examples/demo.json --rule-context examples/rule-context-demo.json --out local-data/rule-diagnosis.json
