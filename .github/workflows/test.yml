name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[evidence]"
      - run: python -m unittest discover -s tests -v
      - run: python -m cbengine.preview examples/demo.json --out-dir local-data/preview-ci
      - run: python -m cbengine.preview examples/demo.json --interactive --out-dir local-data/interactive-ci
      - run: python -m cbengine.bridge examples/bridge-fixed-demo.json --out-dir local-data/bridge-ci
      - run: cb-engine examples/demo.json --out local-data/result.json
      - run: cb-engine examples/portfolio.json --mode portfolio --out local-data/portfolio.json
      - run: cb-engine examples/portfolio.json --mode screen --max-price 110 --exclude-call-risk --out local-data/screen.json
      - run: cb-engine examples/market-demo.json --format html --out local-data/card.html
      - run: cb-engine examples/market-demo.json --terms examples/terms-113042.json --format html --out local-data/evidence-card.html
      - run: python -m cbengine.rules examples/rule-context-demo.json --out local-data/rules.json
      - run: cb-engine examples/demo.json --rule-context examples/rule-context-demo.json --out local-data/rule-diagnosis.json
      - run: cb-engine examples/analysis-market-demo.json --analysis-input examples/analysis-demo.json --quality-as-of 2026-10-09 --out local-data/analysis.json
      - run: python -m cbengine.crosscheck examples/crosscheck-flat.json --out local-data/crosscheck.json
  optional-quantlib-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . QuantLib==1.43
      - run: python -m unittest discover -s tests -p test_crosscheck.py -v
      - run: python -m cbengine.crosscheck examples/crosscheck-flat.json --quantlib --out local-data/quantlib-crosscheck.json
      - run: python -m cbengine.crosscheck examples/crosscheck-nonflat.json --quantlib --out local-data/nonflat.json
      - run: python -m cbengine.crosscheck examples/crosscheck-payment-boundary.json --quantlib --out local-data/boundary.json

  isolated-wheel-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps --no-cache-dir --verbose --wheel-dir standalone-wheels
      - run: python scripts/verify_standalone.py --wheel standalone-wheels/*.whl --work-dir "${{ runner.temp }}/cb-standalone"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-wheel-acceptance
          path: |
            ${{ runner.temp }}/cb-standalone/acceptance.json
            ${{ runner.temp }}/cb-standalone/run/scenarios
            ${{ runner.temp }}/cb-standalone/run/cn-scenarios
