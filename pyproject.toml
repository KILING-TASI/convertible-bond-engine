[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "convertible-bond-engine"
version = "0.11.0"
description = "Auditable A-share convertible bond cashflows and clause diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[project.optional-dependencies]
market = ["akshare>=1.17,<2"]
evidence = ["pypdf>=5,<7"]

[project.scripts]
cb-engine = "cbengine.cli:main"

[tool.setuptools.packages.find]
include = ["cbengine*"]

[tool.setuptools.package-data]
cbengine = ["data/*.json", "data/*.js"]

[tool.setuptools.data-files]
"share/convertible-bond-engine" = ["README.md", "DISCLAIMER.md", "ROADMAP.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
"share/convertible-bond-engine/docs" = ["docs/*.md", "docs/rule-corrections.json", "docs/DATA_ENTRY_CATALOG.json", "docs/DATA_REUSE_CHECK.json", "docs/source-envelope-proposal.json", "docs/STANDALONE_ACCEPTANCE.json", "docs/STANDALONE_CI_ACCEPTANCE.json", "docs/SCENARIO_ACCEPTANCE.json"]
"share/convertible-bond-engine/examples" = ["examples/*.json"]
"share/convertible-bond-engine/scripts" = ["scripts/compare_workbench.py", "scripts/compare_bridge_workbench.py", "scripts/verify_standalone.py"]
"share/convertible-bond-engine/cbengine/data" = ["cbengine/data/market_rules.json"]
"share/convertible-bond-engine/docs/preview" = ["docs/preview/*.json", "docs/preview/*.html", "docs/preview/*.png"]
"share/convertible-bond-engine/licenses" = ["licenses/*.txt", "licenses/sources.json"]
"share/convertible-bond-engine/docs/interactive-preview" = ["docs/interactive-preview/*.json", "docs/interactive-preview/*.html", "docs/interactive-preview/*.png"]
"share/convertible-bond-engine/docs/bridge-acceptance" = ["docs/bridge-acceptance/*.json"]
"share/convertible-bond-engine/docs/native-bridge-v1" = ["docs/native-bridge-v1/*.json"]
"share/convertible-bond-engine/docs/native-bridge-final-801f224" = ["docs/native-bridge-final-801f224/*.json"]
"share/convertible-bond-engine/docs/native-bridge-final-32e42b4" = ["docs/native-bridge-final-32e42b4/*.json"]
