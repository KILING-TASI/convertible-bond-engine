[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convertible-bond-engine"
version = "0.11.0"
description = "Auditable A-share convertible bond cashflows and clause diagnostics"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
market = ["akshare>=1.17,<2"]
evidence = ["pypdf>=5,<7"]

[project.scripts]
cb-engine = "cbengine.cli:main"

[tool.setuptools.packages.find]
include = ["cbengine*"]

[tool.setuptools.package-data]
cbengine = ["data/*.json"]
