[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convertible-bond-engine"
version = "0.1.0"
description = "Auditable A-share convertible bond cashflows and clause diagnostics"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
cb-engine = "cbengine.cli:main"

[tool.setuptools.packages.find]
include = ["cbengine*"]
